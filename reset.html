<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث نظام ضبط الجودة</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#17212B;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}div{background:#fff;color:#17212B;border-radius:16px;padding:28px;max-width:420px;text-align:center}</style></head>
<body><div><h2>جارٍ تحديث البرنامج…</h2><p id="m">حذف النسخة القديمة المخزنة. بياناتك وتسجيلاتك لا تُحذف.</p></div>
<script>
(async () => {
  try { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) await r.unregister(); } catch (e) {}
  try { const ks = await caches.keys(); for (const k of ks) await caches.delete(k); } catch (e) {}
  document.getElementById('m').textContent = 'تم. يُفتح البرنامج الآن…';
  setTimeout(() => location.replace('./?v=' + Date.now()), 1200);
})();
</script></body></html>
