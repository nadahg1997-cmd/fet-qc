<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث البرنامج</title>
<style>body{font-family:Tahoma,Arial,sans-serif;background:#F4F6F8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.b{background:#fff;border-radius:14px;padding:24px;max-width:380px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.08)}h2{margin:0 0 8px}p{color:#555;line-height:1.6}</style></head>
<body><div class="b"><h2>🔄 تحديث البرنامج</h2><p id="m">جارٍ مسح النسخة القديمة المحفوظة على هذا الجهاز…</p><p style="font-size:13px">البيانات لا تُمسح – فقط ملفات البرنامج.</p></div>
<script>
(async () => { const m = document.getElementById('m');
  try { if (navigator.serviceWorker) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
        if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) {}
  let v = ''; try { const r = await fetch('version.json?t=' + Date.now(), {cache: 'no-store'}); v = (await r.json()).v || ''; } catch (e) {}
  m.textContent = 'تم. يُفتح البرنامج الآن' + (v ? ' – الإصدار ' + v : '') + '…';
  setTimeout(() => location.replace('./?v=' + Date.now()), 900); })();
</script></body></html>
