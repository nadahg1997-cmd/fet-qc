<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>
window.__errs=[];window.addEventListener('error',function(e){window.__errs.push((e.message||'error')+' @'+(e.lineno||0)+':'+(e.colno||0));});
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>F.E.T – نظام ضبط الجودة</title>
<script src="config.js"></script>
<script src="xlsx.full.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17212B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* [THEME] الألوان: --brand البرتقالي، --ink الغامق، --ok الأخضر، --bad الأحمر */
/* ===== F.E.T QC — Control-room theme =====
   graphite #17212B · aluminum #EDF0F3 · laminate #FFFFFF · F.E.T orange #E8772E · steel #5B6B7A */
:root{
  --ink:#17212B; --ink2:#5B6B7A; --ink3:#8A97A3;
  --bg:#EDF0F3; --paper:#FFFFFF; --line:#D9DFE5; --line2:#E8ECF0;
  --brand:#E8772E; --brand-d:#B85A1C; --brand-l:#FDF0E6;
  --ok:#1F7A5A; --ok-l:#E3F2EB; --warn:#A86B12; --warn-l:#FBF0DA; --bad:#B83227; --bad-l:#F9E3E0;
  --side:#17212B; --side2:#223040;
  --r:14px; --r2:10px;
  --shadow:0 1px 2px rgba(23,33,43,.06), 0 8px 24px rgba(23,33,43,.06);
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --steel:var(--line2);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.muted{color:var(--ink2);font-size:14.5px}
.b{font-weight:600}

/* ===== shell ===== */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
aside.side{display:none}
@media(min-width:1000px){
  .app{grid-template-columns:248px 1fr}
  aside.side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--side);color:#E6ECF1;padding:18px 14px;gap:4px;overflow:auto}
  nav.tabs{display:none!important}
  main{padding-bottom:40px!important}
  .sticky-save{bottom:0!important}
  header .brand{display:none}
}
.side .brandbox{display:flex;align-items:center;gap:12px;padding:6px 8px 20px;border-bottom:1px solid var(--side2);margin-bottom:12px}
.side .brandbox img{width:40px;height:44px;background:#fff;border-radius:8px;padding:3px}
.side .brandbox b{display:block;font-size:17px;color:#fff}
.side .brandbox span{font-size:12.5px;color:#9FB0BF}
.side button.nv{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#C9D4DD;padding:11px 12px;border-radius:10px;font-size:15.5px;font-weight:500;text-align:right;width:100%}
.side button.nv svg{width:21px;height:21px;flex:none;opacity:.85}
.side button.nv:hover{background:var(--side2);color:#fff}
.side button.nv.on{background:var(--brand);color:#fff;font-weight:700}
.side button.nv.on svg{opacity:1}
.side .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:700}
.side .foot{margin-top:auto;padding:14px 8px 4px;border-top:1px solid var(--side2);font-size:13px;color:#9FB0BF}

header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 22px;flex-wrap:wrap}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
header .brand img{width:30px;height:33px}
header .today{color:var(--ink2);font-size:14.5px;margin-inline-end:auto}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(23,33,43,.15)}
header select{background:var(--paper);border:1px solid var(--line);padding:8px 12px;border-radius:10px;min-width:150px;max-width:220px;font-weight:600}
.sync{font-size:13px;border-radius:999px;padding:5px 12px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sync.on{background:var(--ok-l);color:var(--ok)}.sync.wait{background:var(--warn-l);color:var(--warn)}.sync.off{background:var(--bad);color:#fff}

main{max-width:1180px;width:100%;margin:0 auto;padding:22px 22px 120px}
h1{font-size:27px;line-height:1.25;margin:4px 0 16px;font-weight:700;letter-spacing:-.2px}
h2{font-size:18.5px;margin:28px 0 12px;font-weight:700}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pagehead p{margin:0;color:var(--ink2)}

/* ===== surfaces ===== */
.panel{background:var(--paper);border-radius:var(--r);padding:18px;border:1px solid var(--line2);box-shadow:var(--shadow)}
.panel.late{border:2px solid var(--bad)}
.banner{border-radius:var(--r2);padding:12px 16px;margin-bottom:16px;font-weight:600}
.banner.warn{background:var(--warn-l);color:#6A4508}
.banner.bad{background:var(--bad);color:#fff;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}

/* ===== buttons & inputs ===== */
.btn{border:1px solid var(--line);border-radius:var(--r2);padding:11px 20px;min-height:48px;font-weight:600;font-size:16px;background:var(--paper);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--ink3)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand-d)}
.btn.k{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.d{background:var(--paper);border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14.5px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--ink2);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{background:#FBFCFD;border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px;font-size:16px;min-height:48px;width:100%;color:var(--ink);transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;background:#fff;box-shadow:0 0 0 3px var(--brand-l)}
textarea{min-height:80px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 18px;min-height:44px;font-weight:600;font-size:15px;color:var(--ink2)}
.pick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sticky-save{position:sticky;bottom:76px;padding:12px 0 4px;display:flex;gap:10px;z-index:5;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.sticky-save .btn.p{flex:1;font-size:18px;min-height:56px;box-shadow:0 6px 18px rgba(232,119,46,.35)}

/* ===== home ===== */
.homegrid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:1000px){.homegrid{grid-template-columns:1.55fr 1fr}}
@media(max-width:999px){.homegrid .taskcol{order:-1}}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{margin:0}
.hello .sub{color:var(--ink2);font-size:15px}
.linecard{padding:20px 18px 14px}
.linecard .cap{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.linecard .cap b{font-size:17px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px}
.flow{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:24px 8px;padding:18px 4px 6px}
.stn{position:relative;z-index:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 2px;text-align:center}
.stn::after{content:"";position:absolute;top:26px;height:4px;right:50%;left:calc(-50% - 8px);background:var(--line);z-index:-1;border-radius:2px}
.stn:nth-child(5n)::after,.stn:last-child::after{display:none}
.stn .dot{width:56px;height:56px;border-radius:50%;background:var(--paper);border:4px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--ink);transition:transform .15s}
.stn:hover .dot{transform:scale(1.07);border-color:var(--brand)}
.stn.s-ok .dot{border-color:var(--ok);background:var(--ok-l);color:var(--ok)}
.stn.s-warn .dot{border-color:#D99A2B;background:var(--warn-l);color:var(--warn)}
.stn.s-bad .dot{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.stn .nm{font-weight:600;font-size:14.5px;line-height:1.3}
.stn .ms{font-size:12.5px;color:var(--ink2)}
.stn .ms.r{color:var(--bad);font-weight:600}
@media(max-width:640px){.flow{grid-template-columns:repeat(3,1fr)}.stn::after{display:none}.stn::after{content:"";position:absolute;top:26px;height:4px;right:50%;left:calc(-50% - 8px);background:var(--line);z-index:-1;border-radius:2px}
.stn:nth-child(5n)::after,.stn:last-child::after{display:none}
.stn .dot{width:50px;height:50px}}
.tasks{display:flex;flex-direction:column}
.td{border:0;background:transparent;text-align:right;padding:12px 4px 12px 8px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line2);font-size:15px;font-weight:500;color:var(--ink);width:100%}
.td:last-child{border-bottom:0}
.td::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--ink3)}
.td.bad::before{background:var(--bad)} .td.warn::before{background:#D99A2B} .td.ok::before{background:var(--ok)}
.td:hover{background:var(--line2)}
.td.ok{cursor:default}
.morebtn{border:0;background:transparent;color:var(--brand-d);font-weight:700;padding:10px 4px 0;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:var(--line)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1}
.kpi .k{font-size:13.5px;color:var(--ink2);margin-top:4px}
.kpi.warn::after{background:#D99A2B}.kpi.warn .v{color:var(--warn)}
.kpi.bad::after{background:var(--bad)}.kpi.bad .v{color:var(--bad)}
.kpi.ok::after{background:var(--ok)}
.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14.5px}
.feed .it:last-child{border-bottom:0}
.feed .tm{color:var(--ink2);font-size:13px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mod{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:16px;text-align:right;display:flex;flex-direction:column;gap:4px;min-height:104px;box-shadow:var(--shadow)}
.mod:hover{border-color:var(--brand)}
.mod svg{width:26px;height:26px;color:var(--brand)}
.mod b{font-size:17px;margin-top:4px}
.mod span{font-size:13.5px;color:var(--ink2)}
.mod.due{border:2px solid #D99A2B}

/* production tiles (stage picker) */
.line{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:760px){.line{grid-template-columns:repeat(2,1fr)}}
.st{position:relative;background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:14px 14px 16px;text-align:right;min-height:118px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);border-top:5px solid var(--line)}
.st:hover{border-color:var(--brand);border-top-color:var(--brand)}
.st .n{font-size:13px;color:var(--ink3);font-weight:600}
.st .t{font-size:18px;font-weight:700}
.st .c{margin-top:auto;font-size:13.5px;color:var(--ink2)}
.st .c b{font-size:22px;color:var(--ink)}
.st.s-ok{border-top-color:var(--ok)}.st.s-warn{border-top-color:#D99A2B}.st.s-bad{border-top-color:var(--bad)}
.due{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.late{background:var(--bad-l);border-color:var(--bad);color:#7A1E16;font-weight:700}
.chip.ok{background:var(--ok-l);border-color:#A8D5C1;color:var(--ok)}

/* ===== forms ===== */
.info{background:var(--brand-l);border:1px solid #F5D3BB;border-radius:var(--r2);padding:12px 14px;font-size:14.5px;margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 16px}
.info b{color:var(--brand-d)}
.info .qn{grid-column:1/-1;white-space:pre-line;border-top:1px dashed #E9B994;padding-top:6px}
.ck{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.ck:last-child{border-bottom:0}
.ck .lb{font-weight:600}
.ck .ac{font-size:13.5px;color:var(--ink2);font-weight:400}
.cls{font-size:11.5px;border-radius:6px;padding:1px 7px;margin-inline-start:7px;font-weight:700;vertical-align:1px}
.cls.حرج{background:var(--bad-l);color:var(--bad)} .cls.رئيسي{background:var(--warn-l);color:var(--warn)} .cls.ثانوي{background:var(--line2);color:var(--ink2)}
.tri{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper)}
.tri button{border:0;background:transparent;width:60px;height:48px;font-size:20px;font-weight:700;color:var(--ink3)}
.tri button+button{border-inline-start:1px solid var(--line)}
.tri button.y.on{background:var(--ok);color:#fff}.tri button.n.on{background:var(--bad);color:#fff}.tri button.s.on{background:var(--ink2);color:#fff}
.score{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.score button{border:0;background:var(--paper);width:48px;height:48px;font-weight:700;font-size:17px;color:var(--ink2)}
.score button+button{border-inline-start:1px solid var(--line)}
.score button.on.s1{background:var(--bad);color:#fff}.score button.on.s2{background:#D2652F;color:#fff}.score button.on.s3{background:#D99A2B;color:#fff}.score button.on.s4{background:#4E9B78;color:#fff}.score button.on.s5{background:var(--ok);color:#fff}
.numin{display:flex;gap:8px;align-items:center}
.numin input{width:120px}
.badge{font-size:12.5px;border-radius:7px;padding:4px 9px;font-weight:700;white-space:nowrap}
.badge.in{background:var(--ok-l);color:var(--ok)} .badge.out{background:var(--bad-l);color:var(--bad)} .badge.na{background:var(--line2);color:var(--ink2)}
.dec{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.dec{grid-template-columns:repeat(2,1fr)}}
.dec button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:17px;font-weight:700;color:var(--ink2)}
.dec button.sug{border:2px dashed var(--ink2)}
.dec button.on{color:#fff;border-style:solid}
.dec button.on[data-d="مقبول"]{background:var(--ok);border-color:var(--ok)}
.dec button.on[data-d="مقبول بملاحظة"],.dec button.on[data-d="مقبول بشرط"]{background:#D99A2B;border-color:#D99A2B}
.dec button.on[data-d="محجور"]{background:var(--warn);border-color:var(--warn)}
.dec button.on[data-d="مرفوض"]{background:var(--bad);border-color:var(--bad)}
.act{border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px}

/* ===== tables & pills ===== */
.tw{overflow:auto;border-radius:var(--r);border:1px solid var(--line2);max-height:66vh;background:var(--paper);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
table.t th{background:#F4F6F8;color:var(--ink2);font-weight:700;padding:11px 12px;text-align:right;position:sticky;top:0;border-bottom:1px solid var(--line);font-size:13.5px;white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num{white-space:nowrap}
table.t input{min-height:40px;padding:6px 9px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--brand-l)}
.pill{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.p-مقبول,.st-مغلق{background:var(--ok-l);color:var(--ok)}
.p-مقبول_بملاحظة,.p-مقبول_بشرط{background:#FCEFD6;color:#8A5A00}
.p-محجور,.st-مفتوح{background:var(--warn-l);color:var(--warn)}
.p-مرفوض,.st-أعيد_فتحه{background:var(--bad-l);color:var(--bad)}
.st-متأخر{background:var(--bad);color:#fff}
.grade-A{background:var(--ok);color:#fff}.grade-B{background:#D99A2B;color:#fff}.grade-C{background:var(--bad);color:#fff}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:4px}
.pr{display:grid;grid-template-columns:180px 1fr 40px;gap:10px;align-items:center;padding:5px 0}

/* ===== bottom nav (phones / portrait tablets) ===== */
nav.tabs{position:fixed;bottom:0;inset-inline:0;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(8,1fr);z-index:30;box-shadow:0 -6px 20px rgba(23,33,43,.06)}
nav.tabs button{border:0;background:transparent;padding:8px 2px 10px;min-height:64px;font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--brand-d);box-shadow:inset 0 3px 0 var(--brand)}
nav.tabs .cnt{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-inline-start:3px}

.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 24px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(23,33,43,.3);max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(23,33,43,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal .panel{max-width:440px;width:100%}

/* ===== documents (report, COA, letter) ===== */
.doc{background:#fff;max-width:880px;margin:0 auto;padding:36px 40px;border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);font-size:15px}
.dochead{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--brand);padding-bottom:12px;margin-bottom:16px}
.dochead img{width:56px}
.docfoot{margin-top:26px;border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--ink2);text-align:center}
table.ct{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
table.ct th,table.ct td{border:1px solid #A9B4BE;padding:7px 9px;text-align:left}
table.ct th{background:#F1F3F5}
table.ct.res th{background:var(--brand);color:#fff}
/* official report */
.rep{background:#fff;max-width:940px;margin:0 auto;border:1px solid var(--line2);border-radius:6px;box-shadow:var(--shadow);padding:30px 34px}
.rhead{display:grid;grid-template-columns:96px 1fr 230px;border:1px solid #A9B4BE;margin-bottom:22px}
.rhead > div{padding:10px;display:flex;align-items:center;justify-content:center}
.rhead .lg{border-inline-end:1px solid #A9B4BE}

function noWhite(o){ if(!o) return false; const p = String(o.paper_type||'').toUpperCase(); return ['PBL','AML','PML'].includes(p) || (p==='ABL' && String(o.roll_color||'').toLowerCase()==='silver'); }
function specFor(ch, o){
  if(!ch.spec) return null;
  const sp = ch.spec;
  if(sp.skipPaper && noWhite(o)) return {skip:true};
  if(ch.k==='weld') return {min:S.settings.weldMin, max:S.settings.weldMax};
  if(sp.seam) return {min:S.settings.seamMin, max:S.settings.seamMax};
  if(sp.dia){ const d = parseFloat(o && o.product_diameter); return isFinite(d) ? {min:+(d-0.6).toFixed(2), max:+(d+0.2).toFixed(2)} : null; }
  if(sp.thick){ const t = parseFloat(String(o && o.roll_thickness || '').split('/')[0]); return isFinite(t) ? {min:Math.round(t*0.9), max:Math.round(t*1.1), nominal:t} : null; }
  if(sp.nominal){ const n = parseFloat(o && o.tube_cylinder_length); if(!isFinite(n)) return null; return {min:+(n-sp.tol).toFixed(2), max:+(n+sp.tol).toFixed(2), nominal:n}; }
  return {min:sp.min, max:sp.max};
}
function evalNum(ch, v, o){
  if(v === '' || v == null) return null;
  const sp = specFor(ch, o); if(!sp) return 'na'; if(sp.skip) return 'skip';
  const x = parseFloat(v); return (x >= sp.min && x <= sp.max) ? 'in' : 'out';
}

function suggestRound(){
  const s = stageBy(F.stage), o = fSpec(); let c = '';
  stageChecks(s).forEach(ch => {
    if(ch.t==='ok' && F.checks[ch.k]==='n' && RANK[ch.c] > RANK[c]) c = ch.c;
    if(ch.t==='num' && evalNum(ch, F.vals[ch.k], o)==='out' && RANK[ch.c||'رئيسي'] > RANK[c]) c = ch.c || 'رئيسي';
  });
  if(F.type==='بدء تشغيل' && F.stage!=='print' && F.checks.lineclear==='n') c = 'حرج';
  if(F.type==='بدء تشغيل' && F.stage!=='print' && F.checks.master==='n' && RANK[c] < 2) c = 'رئيسي';
  let d = c==='حرج'||c==='رئيسي' ? 'محجور' : c==='ثانوي' ? 'مقبول بملاحظة' : 'مقبول';
  if(F.stage==='final'){

function nextHoldNo(date){ const ymd = date.slice(2).replace(/-/g,''); return `H-${ymd}-${pad(S.holds.filter(h=>h.no.startsWith('H-'+ymd)).length+1)}`; }
function saveRound(){
  if(F && F.viewOnly){ toast('هذه الجولة للعرض فقط'); return; }
  const s = stageBy(F.stage);
  if(s.key==='design'){ if(!(F.extra.dname||'').trim() || !(F.extra.customer||'').trim()){ toast('اكتب اسم التصميم والزبون من بطاقة التصميم'); return; }
    if(!F.items || !F.items.length) F.items = [{order:F.order||'', code:'', product:F.extra.dname.trim(), customer:F.extra.customer.trim()}]; }
  if(!F.items || !F.items.length){ toast(F.order && ordRows(F.order).length>1 ? 'اختر منتجاً واحداً على الأقل من الطلبية' : 'اكتب رقم الطلبية أولاً'); $('#fOrder') && $('#fOrder').focus(); return null; }
  if(s.machines.length>1 && !F.machine){ toast('اختر الآلة'); return null; }
  const sg = suggestRound(), o = fSpec(), d = new Date(); const it0 = F.items[0];
  const checks = stageChecks(s).concat(F.type==='بدء تشغيل' && s.key!=='print'?[{k:'lineclear',l:'تنظيف الخط',t:'ok'},{k:'master',l:'العينة المعتمدة',t:'ok'}]:[]);
  const failed = checks.filter(c => (c.t==='ok' && F.checks[c.k]==='n') || (c.t==='num' && (evalNum(c, F.vals[c.k], o)==='out' || (c.multi && (F.vals[c.k+'_r']||[]).some(v => v!=='' && evalNum(c, v, o)==='out'))))).map(c => c.l.split('(')[0].trim());
  const old = F.editId ? S.rounds.find(x => x.id===F.editId) : null;
  const r = {id:old?old.id:uid(), date:old?old.date:todayStr(d), time:old?old.time:timeStr(d), shift:old?old.shift:S.settings.shift, inspector:old?old.inspector:S.settings.inspector, stage:F.stage, type:F.type, machine:F.machine,
    items:F.items.map(i => ({...i})), mi:F.mi||0, order:it0.order, code:it0.code||'', product:F.items.map(i=>i.product||i.code).filter(Boolean).join('، '), customer:[...new Set(F.items.map(i=>i.customer).filter(Boolean))].join('، '), box:F.box, samples:F.samples, extra:{...F.extra}, vals:{...F.vals}, checks:{...F.checks},
    defects:[...F.defects], failed, source:F.source, cls:F.cls ?? sg.cls, decision:F.decision ?? sg.dec, action:F.action, notes:F.notes, qty:F.qty, hold:old?old.hold:'', ncr:old?old.ncr:''};
  if(old){ r.editedBy = CUR.name || S.settings.inspector; r.editedAt = new Date().toISOString(); }
  const desc = [[...failed, ...r.defects].join('، '), r.notes].filter(Boolean).join(' – ');
  if((r.decision==='محجور' || r.decision==='مرفوض') && !r.hold && r.stage!=='design'){
    r.hold = nextHoldNo(r.date);
    S.holds.push({id:uid(), no:r.hold, date:r.date, time:r.time, shift:r.shift, inspector:r.inspector, stage:r.stage, machine:r.machine, order:ordersLabel(r), items:r.items, product:itemsLabel(r), qty:F.qty, desc, cls:r.cls, status:'مفتوح', disposition:r.decision==='مرفوض'?'إتلاف':'', good:'', bad:'', closed:'', ncr:''});
  }
  let ncrWhy = '';
  if(r.cls==='حرج') ncrWhy = 'عيب حرج';
  else if(r.cls==='رئيسي'){
    const same = S.rounds.filter(x => x.date===r.date && x.shift===r.shift && x.stage===r.stage && x.machine===r.machine && x.cls==='رئيسي');
    if(same.length >= 1 && !same.some(x => x.ncr)) ncrWhy = 'عيب رئيسي متكرر في نفس الوردية';
  }
  if(s.key==='final' && r.decision!=='مقبول') ncrWhy = ncrWhy || 'طلبية لم تُحرر من أول فحص';
  if(ncrWhy && !r.ncr && r.stage!=='design'){
    r.ncr = createNCR({source: s.key==='final'?'منتج نهائي':'إنتاج', dept:`${s.name} – ${r.machine}`, order:ordersLabel(r), product:itemsLabel(r), desc:`${ncrWhy}: ${desc}`, requirement:`${s.wi}`, cls:r.cls, qty:F.qty, hold:r.hold, correction:r.hold?'حجز':''});
    const h = S.holds.find(x=>x.no===r.hold); if(h) h.ncr = r.ncr;
  }
  if(old){ const i = S.rounds.indexOf(old); Object.keys(old).forEach(k => delete old[k]); Object.assign(old, r); save(); toast('تم تعديل الجولة'); newRound(F.stage); go('prod'); return; }
  S.rounds.push(r); save();
  if(F.__multi) return r;
  toast([ 'تم حفظ الجولة', r.hold && `حجز ${r.hold}`, r.ncr && `و${r.ncr}`].filter(Boolean).join(' – '));

function newMat(){ M = {id:null, type:'', supplier:'', invoice:'', code:'', name:'', lot:'', qty:'', pkgs:'', coa:'', scores:{}, decision:null, condition:'', notes:''}; }
function matScore(m){
  const cfg = matBy(m.type); if(!cfg) return null;
  let total = 0, any = false, crit = false;
  cfg.groups.forEach(g => { const v = g.items.map(it => +m.scores[it[0]]).filter(x => x>0); if(v.length){ any = true; total += g.w * (v.reduce((a,b)=>a+b,0)/v.length) / 5; } g.items.forEach(it => { if(it[2] && +m.scores[it[0]] > 0 && +m.scores[it[0]] <= 2) crit = true; }); });
  if(!any) return null;
  const w = cfg.groups.filter(g => g.items.some(it => +m.scores[it[0]]>0)).reduce((a,g)=>a+g.w,0);
  return {score: Math.round(total*100/w), crit};
}
const CRIT_MAT = ['rolls','granules','caps','foil','printed'];
function matSuggest(m){
  const r = matScore(m); if(!r) return null;
  if(r.crit || r.score < 70) return 'مرفوض';
  if(CRIT_MAT.includes(m.type) && m.coa==='لا') return 'محجور';
  return r.score >= 85 ? 'مقبول' : 'مقبول بشرط';
}

function exportRows(){
  const R = S.rounds.map(r => { const s = stageBy(r.stage); const row = {'التاريخ':r.date,'الوقت':r.time,'الوردية':r.shift,'المراقب':r.inspector,'المرحلة':s.name,'نوع الفحص':r.type,'الآلة':r.machine,'رقم الطلبية':ordersLabel(r),'كود المنتج':itemsOf(r).map(i=>i.code).filter(Boolean).join('، '),'اسم المنتج':itemsLabel(r),'عدد المنتجات':itemsOf(r).length,'الصندوق / الكرتونة':r.box,'عدد العينات':r.samples};
    (s.extra||[]).forEach(e => row[e.l] = r.extra[e.k] ?? ''); s.checks.forEach(c => row[c.l] = c.t==='num' ? (r.vals[c.k] ?? '') : sym(r.checks[c.k]));
    return Object.assign(row, {'بنود غير مطابقة':(r.failed||[]).join('، '),'نوع العيب':r.defects.join('، '),'تصنيف العيب':r.cls||'لا يوجد','مصدر العيب':r.source,'القرار':r.decision,'الكمية':r.qty,'الإجراء المتخذ':r.action,'رقم الحجز':r.hold,'رقم NCR':r.ncr,'ملاحظات':r.notes}); });
  const Mt = S.mats.map(m => { const cfg = matBy(m.type); const row = {'الرقم':m.no,'التاريخ':m.date,'المراقب':m.inspector,'نوع المادة':cfg.name,'النموذج':cfg.form,'المورد':m.supplier,'الفاتورة':m.invoice,'كود المادة':m.code,'اسم المادة':m.name,'الدفعة':m.lot,'الكمية':m.qty,'الوحدة':cfg.unit,'العبوات':m.pkgs,'شهادة التحليل':m.coa};
    cfg.groups.forEach(g => g.items.forEach(it => row[`${g.n}: ${it[1]}`] = m.scores[it[0]] ?? '')); return Object.assign(row, {'النتيجة %':m.score,'القرار':m.decision,'الشرط':m.condition,'NCR':m.ncr||'','ملاحظات':m.notes}); });

  const H = S.holds.map(h => ({'رقم الحجز':h.no,'التاريخ':h.date,'الوقت':h.time,'الوردية':h.shift,'المراقب':h.inspector,'المرحلة':stageBy(h.stage)?.name||'','الآلة':h.machine,'رقم الطلبية':h.order,'المنتج':h.product,'الكمية':h.qty,'الوصف':h.desc,'التصنيف':h.cls,'القرار':h.disposition,'السليم':h.good,'المرفوض':h.bad,'الحالة':h.status,'تاريخ الإغلاق':h.closed,'NCR':h.ncr}));
  const C = S.complaints.map(c => ({'الرقم':c.no,'تاريخ الاستلام':c.date,'الزبون':c.customer,'الطلبية':c.order,'المنتج':c.product,'تاريخ الإنتاج':c.prodDate,'الوصف':c.desc,'الكمية':c.qty,'إشعار الاستلام':c.ack,'NCR':c.ncr,'الرد الرسمي':c.reply,'التصنيف':c.justified,'الحالة':c.status}));

  const Ca = S.cals.map(c => ({'التاريخ':c.date,'الوردية':c.shift,'الأداة':c.code,'الاسم':c.name,'المرجع':c.ref,'القراءة':c.reading,'النتيجة':c.ok?'مطابق':'خارج الحد','المنفذ':c.by}));
  const Th = S.ths.map(x => ({'التاريخ':x.date,'الوقت':x.time,'الوردية':x.shift,'المكان':x.loc,'الحرارة':x.t,'الرطوبة':x.h,'الحالة':x.ok?'ضمن الحد':'خارج الحد','المنفذ':x.by}));

}

/* ---------- SVG charts ---------- */
const C_OK = '#1F7A5A', C_NOTE = '#D99A2B', C_HOLD = '#A86B12', C_REJ = '#B83227', C_INK = '#17212B', C_BR = '#E8772E';
function chartStages(rows){
  const W = 560, rh = 26, top = 8, lw = 120, max = Math.max(1, ...rows.map(r => r.n));
  const H = top + rows.length * rh + 22;
  let g = '';
  rows.forEach((r, i) => {
    const y = top + i * rh; let x = W - lw - 10;
    g += `<text x="${W-4}" y="${y+16}" text-anchor="end" font-size="12.5" fill="${C_INK}">${esc(r.s.name)}</text>`;
    g += `<rect x="40" y="${y+4}" width="${W-lw-50}" height="16" rx="4" fill="#EEF1F4"/>`;
    [[r.ok,C_OK],[r.note,C_NOTE],[r.held,C_HOLD],[r.rej,C_REJ]].forEach(([v,c]) => { if(!v) return; const w = (W-lw-50) * v / max; x -= w; g += `<rect x="${x}" y="${y+4}" width="${w}" height="16" fill="${c}"/>`; });
    g += `<text x="${Math.min(x, W-lw-6)-6}" y="${y+16}" text-anchor="end" font-size="12" fill="#5B6B7A">${r.n||''}</text>`;
  });
  const lg = [['مقبول',C_OK],['بملاحظة',C_NOTE],['محجور',C_HOLD],['مرفوض',C_REJ]].map(([l,c],i) => `<rect x="${W-12-i*92}" y="${H-12}" width="10" height="10" rx="2" fill="${c}"/><text x="${W-16-i*92}" y="${H-3}" text-anchor="end" font-size="12" fill="#5B6B7A">${l}</text>`).join('');
  return `<svg class="ch" direction="ltr" style="direction:ltr" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="الجولات حسب المرحلة">${g}${lg}</svg>`;
}
function chartDonut(parts, center, sub){
  const tot = parts.reduce((a,p)=>a+p[1],0); const R = 62, r = 40, cx = 80, cy = 80; let a0 = -Math.PI/2, g = '';
  if(!tot) g = `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="#EEF1F4" stroke-width="${R-r}"/>`;
  parts.forEach(([l,v,c]) => { if(!v) return; const a1 = a0 + 2*Math.PI*v/tot; const large = a1-a0 > Math.PI ? 1 : 0;
    const p = (ang, rad) => `${cx+rad*Math.cos(ang)},${cy+rad*Math.sin(ang)}`;
    g += v===tot ? `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${c}" stroke-width="${R-r}"/>` : `<path d="M${p(a0,R)} A${R},${R} 0 ${large} 1 ${p(a1,R)} L${p(a1,r)} A${r},${r} 0 ${large} 0 ${p(a0,r)}Z" fill="${c}"/>`; a0 = a1; });
  const lg = parts.map(([l,v,c],i) => `<rect x="300" y="${28+i*24}" width="11" height="11" rx="2" fill="${c}"/><text x="292" y="${38+i*24}" text-anchor="end" font-size="13" fill="${C_INK}">${l}: ${v}${tot?` (${pct(v,tot)}%)`:''}</text>`).join('');
  return `<svg class="ch" direction="ltr" style="direction:ltr" viewBox="0 0 320 165" width="100%" role="img" aria-label="${esc(sub)}">${g}<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="${String(center).length>5?15:22}" font-weight="700" fill="${C_INK}">${center}</text><text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="11" fill="#5B6B7A">${sub}</text>${lg}</svg>`;
}
function chartPareto(items){
  if(!items.length) return '<p class="muted">لا توجد عيوب مسجلة في هذه الفترة.</p>';
  const W = 600, H = 230, pl = 30, pr = 34, pt = 14, pb = 66, n = items.length, bw = Math.min((W-pl-pr)/n, 80), max = items[0][1], tot = items.reduce((a,x)=>a+x[1],0);
  let g = '', cum = 0, pts = [];
  items.forEach(([l,v],i) => { const x = W - pr - (i+1)*bw; const h = (H-pt-pb) * v / max; g += `<rect x="${x+bw*0.18}" y="${H-pb-h}" width="${bw*0.64}" height="${h}" rx="3" fill="${i<3?C_BR:'#C9D2DA'}"/><text x="${x+bw/2}" y="${H-pb-h-4}" text-anchor="middle" font-size="11.5" fill="${C_INK}">${v}</text>`;
    g += `<text transform="translate(${x+bw/2},${H-pb+12}) rotate(-35)" text-anchor="end" font-size="11.5" fill="#5B6B7A">${esc(l.length>18?l.slice(0,17)+'…':l)}</text>`;
    cum += v; pts.push(`${x+bw/2},${pt + (H-pt-pb)*(1-cum/tot)}`); });
  g += `<polyline points="${pts.join(' ')}" fill="none" stroke="${C_INK}" stroke-width="2"/>` + pts.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="${C_INK}"/>`).join('');
  g += `<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#A9B4BE"/><text x="${pl-4}" y="${pt+4}" text-anchor="end" font-size="11" fill="#5B6B7A">100%</text><text x="${pl-4}" y="${pt+(H-pt-pb)*0.2+4}" text-anchor="end" font-size="11" fill="#5B6B7A">80%</text><line x1="${pl}" x2="${W-pr}" y1="${pt+(H-pt-pb)*0.2}" y2="${pt+(H-pt-pb)*0.2}" stroke="#D9DFE5" stroke-dasharray="4 4"/>`;
  return `<svg class="ch" direction="ltr" style="direction:ltr" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="باريتو العيوب">${g}</svg>`;
}

/* ---------- statistics ---------- */
function periodOf(kind, ref = todayStr()){
  const d = new Date(ref);
  if(kind==='d') return [ref, ref];
  if(kind==='w') return [addDays(ref,-6), ref];
  if(kind==='m') return [ref.slice(0,8)+'01', ref];
  if(kind==='pm') return [todayStr(new Date(d.getFullYear(), d.getMonth()-1, 1)), todayStr(new Date(d.getFullYear(), d.getMonth(), 0))];
  if(kind==='q') return [addDays(ref,-89), ref];
}
function gapsOf(rs){
  const g = {}; rs.filter(r => r.machine && r.machine!=='—' && !['design','final'].includes(r.stage)).forEach(r => (g[r.date+'|'+r.stage+'|'+r.machine] = g[r.date+'|'+r.stage+'|'+r.machine] || []).push(String(r.time||'00:00')));
  const diffs = []; Object.values(g).forEach(ts => { ts.sort(); for(let i=1;i<ts.length;i++){ const [a,b] = ts[i-1].split(':').map(Number), [c,e] = ts[i].split(':').map(Number); const m = (c*60+e)-(a*60+b); if(m>0 && m<240) diffs.push(m); } });
  return {n:diffs.length, ontime: diffs.filter(m => m<=35).length, avg: diffs.length ? Math.round(diffs.reduce((a,b)=>a+b,0)/diffs.length) : null};
}
function userStats(name, from, to){
  const inR = d => d && d >= from && d <= to;
  const rs = S.rounds.filter(r => r.inspector===name && inR(r.date));
  const shifts = new Set(rs.map(r => r.date+'|'+r.shift)).size; const g = gapsOf(rs);
  const last = rs.length ? rs[rs.length-1] : null;
  return { name, rounds:rs.length, m:rs.filter(r=>r.shift==='صباحية').length, e:rs.filter(r=>r.shift==='مسائية').length, days:new Set(rs.map(r=>r.date)).size, shifts,
    perShift: shifts ? Math.round(rs.length/shifts) : 0, ontime: g.n ? pct(g.ontime, g.n) : null, gap: g.avg,
    issues: rs.filter(r=>r.decision!=='مقبول').length, crit: rs.filter(r=>r.cls==='حرج').length, firstOff: rs.filter(r=>r.type==='بدء تشغيل').length, finals: rs.filter(r=>r.stage==='final').length,
    holds: S.holds.filter(h=>h.inspector===name && inR(h.date)).length, ncrs: S.ncrs.filter(n=>n.by===name && inR(n.date)).length, mats: S.mats.filter(m=>m.inspector===name && inR(m.date)).length,
    audits: S.audits.filter(a=>a.inspector===name && inR(a.date)).length, cals: S.cals.filter(c=>c.by===name && inR(c.date)).length, ths: S.ths.filter(x=>x.by===name && inR(x.date)).length,
    hand: S.handovers.filter(h=>h.from===name && inR(h.date)).length, last: last ? `${last.date} ${last.time}` : '—',
    stages: STAGES.map(s => [s.name, rs.filter(r=>r.stage===s.key).length]).filter(x => x[1]),
    probs: rs.filter(r=>r.decision!=='مقبول').slice(-6).reverse(),
    openHolds: S.holds.filter(h=>h.inspector===name && h.status!=='مغلق'), openNcr: S.ncrs.filter(n=>n.by===name && !n.closed) };
}
function kpiSet(from, to){
  const inR = d => d && d >= from && d <= to;
  const rs = S.rounds.filter(r => inR(r.date)), iss = rs.filter(r=>r.decision!=='مقبول');
  const fo = rs.filter(r=>r.type==='بدء تشغيل'), fin = rs.filter(r=>r.stage==='final'), g = gapsOf(rs);
  const hc = S.holds.filter(h => h.closed && inR(h.closed)); const nc = S.ncrs.filter(n => n.closed && inR(n.closed));

  const mats = S.mats.filter(m => inR(m.date)); const shifts = new Set(rs.map(r=>r.date+'|'+r.shift));
  const calS = new Set(S.cals.filter(c=>inR(c.date)).map(c=>c.date+'|'+c.shift)), thS = new Set(S.ths.filter(x=>inR(x.date)).map(x=>x.date+'|'+x.shift));
  const nul = v => v===null || Number.isNaN(v) ? null : v;
  return {
    rounds: rs.length,
    issues: rs.length ? pct(iss.length, rs.length) : null,
    crit: rs.filter(r=>r.cls==='حرج').length,
    ontime: g.n ? pct(g.ontime, g.n) : null,

    holdDays: hc.length ? +(hc.reduce((a,h)=>a+daysBetween(h.date,h.closed),0)/hc.length).toFixed(1) : null,
    ncrNew: S.ncrs.filter(n=>inR(n.date)).length,

    matAcc: mats.length ? pct(mats.filter(m=>m.decision==='مقبول'||m.decision==='مقبول بشرط').length, mats.length) : null,
    calComp: shifts.size ? pct([...shifts].filter(s=>calS.has(s)).length, shifts.size) : null,
    thComp: shifts.size ? pct([...shifts].filter(s=>thS.has(s)).length, shifts.size) : null,
  };
}

function deltaTag(cur, prev, dir){

}
function targetOk(v, t, dir){ if(v===null || t===null) return ''; return (dir==='up' ? v>=t : v<=t) ? 'ok' : 'bad'; }
function spark(vals, dir){

}
function chartTrend(weeks){

function chartDaily(names, from, to){

/* [OCR] قراءة بطاقة التصميم من صورة البروفا وتعبئة الخانات (عدا الورق والغطاء) */
function parseDesignCard(text, fileName, customers){
  const T = String(text || '').replace(/\r/g, '').replace(/[ \t]+/g, ' ');
  const out = {};
  const m = (re, s) => { const x = (s || T).match(re); return x ? x[1].trim() : ''; };
  const fileBase = String(fileName || '').replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
  const NXN = /(\d{2})\s*[xX×]\s*(\d{2,3})/;
  /* التاريخ */

  /* اسم التصميم */
  let dn = m(/Design\s*Name[:\s]*([^\n]+)/i).replace(/\s*(Size|Diameter|Web|Cap)\b.*$/i, '');
  if(dn && !NXN.test(dn) && dn.trim().split(/\s+/).length < 2) dn = '';
  if(!dn && NXN.test(fileBase)) dn = fileBase;
  if(!dn) dn = m(/([A-Za-z][^\n]*?\d{2}\s*[xX×]\s*\d{2,3}[^\n]*)/).replace(/^(Customer|Design\s*Name)\s*/i, '');
  /* الزبون */
  let cu = m(/Customer[:\s]+([A-Za-z0-9&.'\-]+(?:\s[A-Za-z0-9&.'\-]+){0,3}?)\s*(?:Design\s*Name|\n|$)/i);
  if(cu && NXN.test(cu) && !dn){ const w = cu.split(/\s+/); if(w.length > 2){ dn = w.slice(1).join(' '); cu = w[0]; } }
  { const line = m(/Customer[:\s]+([^\n]*\d{2}\s*[xX×]\s*\d{2,3}[^\n]*)/i); if(line && !/Design\s*Name/i.test(line)){ const w = line.split(/\s+/); if(w.length > 2 && (!dn || dn === line)){ cu = cu && !NXN.test(cu) ? cu : w[0]; dn = w.slice(1).join(' '); } } }
  if(cu && (NXN.test(cu) || !/^[A-Za-z][A-Za-z&.'\-]{2,}/.test(cu) || /^(Design|Name|Size|Web|Cap|Date|Code|Diameter|Length|Type|Color)\b/i.test(cu))) cu = '';
  if(!cu){ const dup = (T + '\n' + dn).match(/\b([A-Za-z][\w&.'\-]{2,}(?:\s[A-Za-z][\w&.'\-]{2,})?)\s+\1\b/i); if(dup){ cu = dup[1]; const k = T.search(new RegExp(dup[1] + '\\s+' + dup[1], 'i')); if(k >= 0){ const line = T.slice(k).split('\n')[0]; const rest = line.slice(dup[1].length).trim(); if(NXN.test(rest) || !dn) dn = rest.replace(/\s+(Size|Diameter)\b.*$/i, ''); } } }
  const known = (customers || []).filter(Boolean).sort((a, b) => b.length - a.length);
  if(!cu){ const k = known.find(c => (T + ' ' + dn).toLowerCase().includes(String(c).toLowerCase().split(/[\s.]/)[0])); if(k) cu = k; }
  if(!cu && dn) cu = dn.split(' ')[0];
  if(cu && dn){ const i = dn.toLowerCase().indexOf(cu.toLowerCase().split(/[\s.]/)[0]); if(i > 0) dn = dn.slice(i); }
  { const w = (dn||'').trim().split(/\s+/); if(w.length > 2 && w[0].toLowerCase() === w[1].toLowerCase()){ if(!cu) cu = w[0]; dn = w.slice(1).join(' '); } }
  if(cu){ const k = known.find(c => String(c).toLowerCase().split(/[\s.]/)[0] === cu.toLowerCase().split(/[\s.]/)[0]); if(k) cu = k; }
  if(dn) out.dname = dn.trim(); if(cu) out.customer = cu.trim();
  /* القطر والطول */
  let dia = m(/Diameter[^\d]{0,20}(\d{2}(?:\.\d+)?)\s*mm/i), len = m(/Length[^\d]{0,20}(\d{2,3}(?:\.\d+)?)\s*mm/i);

    if(!(CUR.name && GAS_PIN)) await loadSession();
    if(CUR.name && GAS_PIN && !CUR.role){ try{ const r = await apiLogin(CUR.name, GAS_PIN); CUR = {name:r.name, role:r.role}; }catch(e){ if(String(e && e.message || e).includes('BADPIN')) CUR.role = ''; else { const s = await IDB.get('session'); CUR.role = s && s.name===CUR.name ? s.role : ''; online = false; } } }
    else if(CUR.name && GAS_PIN && CUR.role){ apiLogin(CUR.name, GAS_PIN).then(r => { CUR.role = r.role; saveSession(); }).catch(e => { if(String(e && e.message || e).includes('BADPIN')){ IDB.del('session'); location.reload(); } }); }
    if(!CUR.role){ renderHeader(); render(); askPin(false); return; }
    S.orders = []; await localRestore();
    if(!S.settings.inspectors.includes(CUR.name)) S.settings.inspectors.push(CUR.name);
    S.settings.inspector = CUR.name;
    renderHeader(); render();
    syncNow().then(async () => {
      if(!S.orders.length){ S.orders = DEFAULT_ORDERS; S.ordersDate = ''; }
      const ul = await apiUsers(); if(ul.length) S.settings.inspectors = ul;
      S.settings.inspector = CUR.name; autoDaily(); renderHeader();
      const typing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
      if(!FORM_VIEWS.includes(view) && !typing) rerender(); else renderTabs();
    });
  } else {
    await load(); CUR = {name:S.settings.inspector || 'مدير القسم', role:'manager'}; S.settings.inspector = CUR.name; if(!S.reports) S.reports = []; autoDaily();
  }
  renderHeader(); render();
  if(serverMode && CUR.role){ saveSession(); restoreDraft(); checkServerVersion(); }
}
startApp().catch(err => { console.error(err); if(typeof showFatal === 'function') showFatal((err && err.message) + '\n' + String(err && err.stack || '').split('\n').slice(0,4).join('\n'), true); });

window.__appLoaded = true;
</script>
